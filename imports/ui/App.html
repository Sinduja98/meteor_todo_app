<body class="bg-dark text-white" style="background: linear-gradient(to bottom, #91b0d8, #918e82 100%);">
    {{> mainContainer }}
</body>

<template name="mainContainer">
    <div class="d-flex flex-column vh-100">
        <header class="bg-light shadow p-3 border-bottom" style="background: linear-gradient(to bottom, #b4cceb, #eeece3 100%);">
            <div class="d-flex justify-content-between align-items-center">
                <div class="text-truncate d-inline-block w-100 overflow-hidden">
                    <h1 class="h4 m-0 text-dark">Todo List {{incompleteCount}}</h1>
                </div>
            </div>
        </header>
     
        <main class="flex-grow-1 overflow-auto bg-white">

            {{#if isUserLogged}}
            <div class="user text-end fw-bold m-3 text-dark">
                {{getUser.username}}
            </div>
            {{> form }}
            <div class="filter d-flex justify-content-center p-3">
                    <button id='hide-completed-button' class="btn btn-primary align-items-center">
                    {{#if hideCompleted}}
                            Show All
                    {{else}}
                            Hide Completed
                    {{/if}}
                </button>
            </div>
            {{#if isLoading}}
                    <div class="loading d-flex flex-column justify-content-center align-items-center fw-bold vh-100">loading...</div>
            {{/if}}
            <ul>
                {{#each tasks}}
                    {{> task}}
                {{/each}}
            </ul>
            {{else}}
                {{> login }}
            {{/if}}
        </main>
    </div>
</template>


<template name="form">
    <form class="d-flex gap-2 m-3">
        <input type="text" name='text' class="form-control" placeholder="Type to add new tasks">
        <button class="btn btn-primary" type="submit">Add Task</button>
    </form>
    
</template>
